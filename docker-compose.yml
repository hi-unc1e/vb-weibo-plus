services:
  weibo-plus:
    image: yingdao/vb-weibo-plus:latest
    build: .
    container_name: weibo-plus
    expose:
      - "18080"
    volumes:
      - ./data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: weibo-plus-nginx
    ports:
      - "18080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
    depends_on:
      - weibo-plus
    restart: unless-stopped
