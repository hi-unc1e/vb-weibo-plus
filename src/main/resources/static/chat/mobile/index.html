<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>微博群聊</title>
  <link rel="stylesheet" href="chat.css">
  <script src="../weibo-emoji.js" defer></script>
  <script src="chat.js" defer></script>
</head>
<body>
  <main class="app" id="app" data-view="groups">

    <section class="view view-groups" aria-label="群聊列表">
      <header class="topbar groups-topbar">
        <h1>微博群聊</h1>
        <a class="desktop-link" href="/chat/index.html" id="desktop-link">桌面版</a>
      </header>
      <label class="search-box">
        <span class="visually-hidden">搜索群聊</span>
        <input id="group-search" type="search" placeholder="搜索群聊" autocomplete="off">
      </label>
      <button class="login-banner" id="login-banner" type="button" hidden>⚠️ 登录已失效，点此扫码恢复</button>
      <div class="groups-list" id="groups-list" aria-live="polite"></div>
      <div class="view-state" id="groups-state" role="status"></div>
      <button class="retry-button" id="retry-groups" type="button" hidden>🔄 重新加载</button>
    </section>

    <section class="view view-chat" aria-label="聊天内容">
      <header class="topbar chat-topbar">
        <button class="back-button" id="back-button" type="button" aria-label="返回群聊列表">‹</button>
        <span class="chat-avatar" id="current-group-avatar" aria-hidden="true">群</span>
        <div class="chat-title">
          <h2 id="current-group">请选择群聊</h2>
          <span class="chat-subtitle" id="current-size"></span>
        </div>
      </header>

      <div class="messages-shell">
        <div class="messages" id="messages" aria-live="polite"></div>
        <button class="new-messages-button" id="new-messages" type="button" hidden>↓ 有新消息</button>
      </div>

      <div class="composer" aria-label="消息编辑器">
        <div class="composer-attachment" id="composer-attachment" hidden>
          <img class="attachment-preview" id="attachment-preview-image" alt="待发送图片预览">
          <video class="attachment-preview" id="attachment-preview-video" hidden muted playsinline></video>
          <button class="attachment-remove" id="attachment-remove" type="button" aria-label="删除附件">✕</button>
        </div>
        <div class="composer-row">
          <button class="attach-button" id="attach-open" type="button" aria-label="添加图片或视频" disabled>＋</button>
          <input id="attach-input" type="file" accept="image/*,video/mp4" hidden>
          <textarea id="composer" rows="1" enterkeyhint="newline" aria-label="输入消息" placeholder="发消息…"></textarea>
          <button class="send-button" id="send-button" type="button" disabled>发送</button>
        </div>
        <p class="composer-hint" id="composer-hint" role="status"></p>
      </div>
    </section>

    <div class="login-sheet" id="login-sheet" hidden>
      <div class="login-card" role="dialog" aria-label="扫码登录">
        <h2>扫码登录微博</h2>
        <div class="qr-loading" id="qr-loading" hidden>正在获取二维码…</div>
        <img id="login-qr-img" alt="扫码登录二维码" hidden>
        <p class="login-note" id="login-note">打开微博 App 扫码确认登录，等待期间请勿关闭此页。</p>
        <button class="login-retry" id="login-qr" type="button">📱 开始扫码登录</button>
      </div>
    </div>

  </main>

  <dialog class="image-viewer" id="image-viewer" aria-label="查看原图">
    <img alt="消息原图">
    <p id="image-viewer-state" role="status"></p>
  </dialog>
</body>
</html>
